name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install NDK 26.1 + CMake 3.22 (pinned in app/build.gradle)
      run: |
        set -e
        SDK="$ANDROID_HOME"
        SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
        echo "Using sdkmanager: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1"

    - name: Build with Gradle
      run: ./gradlew build

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: shuati-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: shuati-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
